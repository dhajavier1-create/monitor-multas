ame: Revision Automatica de Infracciones

on:
schedule:
\- cron: '0 12 \* \* \*'
workflow_dispatch:

permissions:
contents: write

jobs:
revisar-flotilla:
runs-on: ubuntu-latest
steps:
\- name: Descargar repositorio
uses: actions/checkout@v4

```
  - name: Configurar Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Instalar librerías y navegador
    run: |
      pip install -r requirements.txt
      playwright install chromium

  - name: Ejecutar bot de infracciones
    env:
      API_KEY_CAPTCHA: ${{ secrets.API_KEY_CAPTCHA }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
      EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
      GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      GITHUB_PAGES_URL: ${{ secrets.GITHUB_PAGES_URL }}
    run: python bot_multas.py

  - name: Publicar App Web y PDFs actualizados
    run: |
      git config user.name "Bot Flotilla"
      git config user.email "bot@flotilla.local"
      git add docs/
      git commit -m "Actualizacion diaria de dashboard y PDFs" || exit 0
      git push

```
